version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/packages/tauri"
    schedule:
      interval: "monthly"
      time: "07:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "fabieu"
    groups:
      minor-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "fabieu"
    groups:
      # @glideapps/glide-data-grid and its peer dependencies. Major bumps of
      # react, react-dom and marked must wait until a stable glide release
      # supports them (6.0.3 requires react 16-18 and marked ^4).
      glide-data-grid:
        patterns:
          - "@glideapps/glide-data-grid"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "marked"
          - "lodash"
          - "react-responsive-carousel"
      minor-updates:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    assignees:
      - "fabieu"
    groups:
      gh-actions:
        patterns:
          - "*"

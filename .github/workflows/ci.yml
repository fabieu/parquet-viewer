name: CI

on:
  pull_request:
  # Runs on main only to refresh the Rust cache that pull requests restore:
  # after a dependency change, and weekly for new stable Rust releases and
  # before GitHub evicts unused caches.
  push:
    branches: [main]
    paths: [packages/tauri/Cargo.lock]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Pinned by SHA, so the toolchain must be named explicitly.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # The bundled DuckDB build takes minutes; cache it. Saved only on main,
      # so pull request caches never evict the one every PR restores.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! needs the frontend build output to exist.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p ../frontend/dist
      # Formatting is the same on every OS; clippy is not (cfg-gated code).
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

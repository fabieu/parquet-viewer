name: Release

# release-please keeps a release PR up to date from Conventional Commits on
# main. Merging it creates the tag and GitHub release; the build job then
# attaches the installers to that release.
on:
  push:
    branches: [main]
  # Manual lever: refresh the release PR, or rebuild the installers of an
  # existing release (e.g. after a failed build).
  workflow_dispatch:
    inputs:
      build_tag:
        description: "Tag to rebuild, e.g. v0.2.0. Empty: only refresh the release PR."
        type: string
        default: ""

# One release run at a time; never cancel one that is uploading installers.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_id: ${{ steps.release.outputs.id || steps.existing.outputs.id }}
      tag: ${{ steps.release.outputs.tag_name || inputs.build_tag }}
    steps:
      # A GitHub App token, unlike GITHUB_TOKEN, lets the release PR trigger CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
      # On a push, inputs.build_tag is null, not '', so the event check is needed.
      - name: Look up existing release
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.build_tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ inputs.build_tag }}
        run: echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.build_tag != '')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      # The tag, not the branch: main may already carry the next commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Installs the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      # Pinned by SHA, so the toolchain must be named explicitly.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: pnpm install --frozen-lockfile
      # Windows signing with Azure Artifact Signing. Unsigned builds are
      # produced while AZURE_CLIENT_ID is not set.
      - name: Check Windows signing
        id: win-signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "args=--config packages/tauri/tauri.windows-signing.conf.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Install artifact-signing-cli
        if: steps.win-signing.outputs.args != ''
        run: cargo install artifact-signing-cli --version 0.11.0 --locked
      # macOS signing and notarization. Unsigned builds are produced while
      # APPLE_CERTIFICATE is not set: Tauri treats an empty variable as set
      # and fails importing the certificate, so the variables are only
      # exported when a certificate exists.
      - name: Check macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              printf '%s<<EOF_%s\n%s\nEOF_%s\n' "$name" "$name" "${!name}" "$name" >> "$GITHUB_ENV"
            done
          fi
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Windows signing, read by artifact-signing-cli.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        with:
          # Upload to the release release-please just created. By id, not
          # tagName: with tagName, tauri-action v1 rewrites the release's
          # name and body, which would erase release-please's changelog.
          releaseId: ${{ needs.release-please.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.win-signing.outputs.args }}

# See all keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
name = "parquet-viewer"
version = "0.5.0"
description = "Fast, read-only desktop viewer for Parquet files"
authors = ["Fabian Eulitz <info@sustineo.de>"]
license = "MIT"
homepage = "https://fabieu.github.io/parquet-viewer/"
repository = "https://github.com/fabieu/parquet-viewer"
edition = "2024"
publish = false

[lib]
name = "parquet_viewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "~2.7.2", features = [] }

[dependencies]
tauri = { version = "~2.12.3", features = [] }
tauri-plugin-dialog = { version = "~2.8.2" }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = { version = "~1.0.154" }
duckdb = { version = "~1.10506.0", features = ["bundled", "parquet", "json"] }
thiserror = { version = "~2.0.21" }
tokio = { version = "~1.53.3", features = ["sync"] }

[dev-dependencies]
insta = { version = "~1.49.0", features = ["json"] }
tempfile = { version = "~3.27.0" }
tokio = { version = "~1.53.3", features = ["macros", "rt"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# DuckDB is C++ and very slow unoptimized; optimize it even in dev builds.
[profile.dev.package.libduckdb-sys]
opt-level = 3
debug = false

# cargo-about config for THIRD_PARTY_LICENSES.json (see scripts/licenses.mjs).
# Only crates that ship in the installers: the release targets, no dev or
# build dependencies.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

# Skip this app itself (publish = false).
private = { ignore = true }

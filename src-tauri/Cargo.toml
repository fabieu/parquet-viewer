[package]
name = "parquet-viewer"
version = "0.1.0"
description = "Fast, read-only desktop viewer for Parquet files"
authors = ["Fabian Eulitz"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "parquet_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
duckdb = { version = "1.10506.0", features = ["bundled", "parquet", "json"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.2"
tokio = { version = "1.53.3", features = ["sync"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt"] }

# DuckDB is C++ and very slow unoptimized; optimize it even in dev builds.
[profile.dev.package.libduckdb-sys]
opt-level = 3
